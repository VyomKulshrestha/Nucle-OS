name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - name: Build workspace
        run: cargo build --workspace
      - name: Run workspace tests
        run: cargo test --workspace

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Build every Rust target
        run: cargo build --workspace --all-targets
      - name: Lint without warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build public API documentation
        run: cargo doc --workspace --no-deps
      - name: Build browser runtime
        run: cargo build -p nucle_wasm --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/nuclescript/package-lock.json
      - name: Test VS Code extension
        working-directory: editors/vscode/nuclescript
        run: npm ci && npm test
