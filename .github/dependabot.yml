version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # rand 0.9 changed the values a seeded random_range draws. Fountain
      # rebuilds each droplet's segments from its seed, so archives written
      # under rand 0.8 would stop decoding (see the DNA Fountain section of
      # docs/architecture.md). Moving needs a sampler of our own first.
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/editors/vscode/nuclescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # vsce refuses @types/vscode newer than engines.vscode, so the two
      # move together, by hand, when the oldest supported VS Code moves.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The oldest supported VS Code (1.91) runs Node 20; newer Node types
      # would let the extension call APIs that editor doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
