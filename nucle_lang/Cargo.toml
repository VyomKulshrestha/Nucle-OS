[package]
name = "nucle_lang"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NucleScript compiler for declarative DNA storage operations"

[features]
default = ["runtime"]
runtime = ["dep:nucle_vfs"]

[dependencies]
nucle_codec = { path = "../nucle_codec" }
nucle_synth = { path = "../nucle_synth" }
nucle_vfs = { path = "../nucle_vfs", optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
log = { workspace = true }
