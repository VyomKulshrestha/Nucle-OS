[package]
name = "nucle_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nucle-lsp"
path = "src/main.rs"

[dependencies]
nucle_lang = { path = "../nucle_lang" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = { workspace = true }
